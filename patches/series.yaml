# Dispatcharr, estate build (plan D 5f): the upstream :dev image, pinned by digest,
# plus the estate's patches -- built by the saltbox MCP's build_patched_image into
# estate.local/dispatcharr:<commit[:12]>. Until 2026-09-19 these were copied into
# the RUNNING container after every create by roles/dispatcharr (hot-patching).
#
# Order is the role's order: migrations first, then the scripts. Every script is
# idempotent and fail-closed: it prints patched / already patched (or "superseded
# upstream" when upstream absorbed it -- retire it) and exits 1 when an anchor is
# gone, which fails the build instead of shipping an unpatched image.
#
# To take a new upstream :dev: replace the digest below with the new one, commit,
# build_patched_image(series_dir=/srv/code/dispatcharr-estate/patches, src_commit=<sha>),
# and stop on any `conflict`.
name: dispatcharr
base:
  # ghcr.io/dispatcharr/dispatcharr:dev as running since 2026-09-16 (built 2026-09-15 23:21Z)
  image: "ghcr.io/dispatcharr/dispatcharr@sha256:94ce2aad92c02dcedf764485f13f008e377bea37269b7ec5707daaf8b7096782"
patches:
  - id: m0028-subtitle-copy
    file: migrations/0028_add_subtitle_copy_to_default_profiles.py
    dest: /app/core/migrations/
  - id: m0029-merge
    file: migrations/0029_merge_20260914_1210.py
    dest: /app/core/migrations/
  # Every PATCH entry of the DVR task script (placeholders, PATCH 15 teletext
  # sidecar, 16 HLS anchors, 17 caption state, 18...). PATCH 18a-d (recording_end after the remux), which retire
  # with upstream PR https://github.com/Dispatcharr/Dispatcharr/pull/1679 --
  # 18e-f are local and permanent. Not split per PATCH id: the script applies its
  # entries as one ordered list against one file.
  - id: patch-tasks
    file: patch-tasks.py
    upstream_pr: https://github.com/Dispatcharr/Dispatcharr/pull/1679
  - id: dedup-crossmatch
    file: patch-dedup-crossmatch.py
  - id: epg-hubfreeze
    file: patch-epg-hubfreeze.py
  - id: proxy-tuning
    file: patch-proxy-tuning.py
